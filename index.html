                    <span style={{ color: lang === 'pt' ? 'var(--accent-blue)' : 'var(--text-muted)', fontWeight: 800 }}>PT</span>
                  </span>
                </button>

                <button onClick={() => { setActiveTab('contact'); window.scrollTo(0,0); }} className="btn-primary" style={{ padding: '0.55rem 1.1rem', fontSize: '0.85rem' }}>
                  {t.nav.bookSession}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN BODY CONTENT */}
          <main style={{ flex: 1 }}>
            {/* HOME PAGE */}
            {activeTab === 'home' && (
              <div className="speed-lines">
                <section style={{ position: 'relative', minHeight: '88vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '8rem 1.5rem 4rem 1.5rem', overflow: 'hidden' }}>
                  <div style={{ position: 'absolute', inset: 0, backgroundImage: 'url(/assets/hero_banner.jpg)', backgroundSize: 'cover', backgroundPosition: 'center 40%', filter: 'brightness(0.65)' }} />
                  <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.15) 0%, rgba(8, 10, 16, 0.95) 100%), linear-gradient(to top, rgba(8, 10, 16, 1) 0%, transparent 40%)' }} />

                  <div className="animate-fade-up" style={{ position: 'relative', zIndex: 2, maxWidth: '980px', textAlign: 'center' }}>
                    <h1 style={{ fontSize: 'clamp(2.3rem, 5.5vw, 4.4rem)', fontWeight: 900, lineHeight: 1.1, letterSpacing: '-0.02em', marginBottom: '1.5rem', textTransform: 'uppercase' }}>
                      {t.hero.title}
                    </h1>

                    <p style={{ fontSize: 'clamp(1.05rem, 1.8vw, 1.3rem)', color: 'var(--text-muted)', maxWidth: '820px', margin: '0 auto', lineHeight: 1.6 }}>
                      {t.hero.subtitle}
                    </p>
                  </div>
                </section>

                {/* 4 CATEGORY BANNERS TEASER (EQUAL HEIGHT, NO SUBTITLES, NO DESCRIPTIONS) */}
                <section style={{ padding: '4rem 1.5rem', maxWidth: '1320px', margin: '0 auto' }}>
                  <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
                    <h2 style={{ fontSize: '2.2rem', textTransform: 'uppercase', marginBottom: '0.75rem' }}>{t.hub.title}</h2>
                    <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', maxWidth: '600px', margin: '0 auto' }}>{t.hub.subtitle}</p>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.5rem' }}>
                    {portfolioData.categories.map((cat) => (
                      <div key={cat.id} onClick={() => { setActiveTab(`category-${cat.id}`); window.scrollTo(0,0); }} className="category-card">
                        <img src={cat.bannerImage} alt={cat.id} />
                        <div className="category-overlay">
                          <div style={{ fontSize: '0.75rem', color: 'var(--accent-blue)', fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '0.35rem' }}>
                            {cat.count} {t.hub.photosCount}
                          </div>
                          <h3 style={{ fontSize: '1.4rem', color: '#FFFFFF', marginBottom: '0.75rem' }}>
                            {lang === 'pt' ? cat.titlePt : cat.titleEn}
                          </h3>
                          <div style={{ color: '#FFFFFF', fontWeight: 700, fontSize: '0.85rem' }}>
                            {t.hub.viewCategory} →
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {/* PORTFOLIO HUB PAGE (EQUAL HEIGHT CARDS, NO SUBTITLES, NO DESCRIPTIONS) */}
            {activeTab === 'portfolio' && (
              <div style={{ padding: '7rem 1.5rem 5rem 1.5rem', maxWidth: '1320px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '4rem' }}>
                  <h1 style={{ fontSize: 'clamp(2.2rem, 4vw, 3.5rem)', textTransform: 'uppercase', marginBottom: '1rem' }}>{t.hub.title}</h1>
                  <p style={{ color: 'var(--text-muted)', fontSize: '1.1rem', maxWidth: '680px', margin: '0 auto' }}>{t.hub.subtitle}</p>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '2.5rem' }}>
                  {portfolioData.categories.map((cat, idx) => (
                    <div key={cat.id} onClick={() => { setActiveTab(`category-${cat.id}`); window.scrollTo(0,0); }} className="glass-card hub-card-row">
                      <div style={{ order: idx % 2 === 0 ? 1 : 2, position: 'relative', overflow: 'hidden' }}>
                        <img src={cat.bannerImage} style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center center' }} />
                      </div>
                      <div style={{ order: idx % 2 === 0 ? 2 : 1, padding: '2.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                        <h2 style={{ fontSize: '2.2rem', marginBottom: '1.5rem', color: 'var(--text-main)', textTransform: 'uppercase' }}>
                          {lang === 'pt' ? cat.titlePt : cat.titleEn}
                        </h2>
                        <div>
                          <button className="btn-primary" style={{ padding: '0.9rem 1.8rem', fontSize: '0.95rem' }}>
                            {t.hub.viewCategory} →
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CATEGORY GALLERY PAGE WITH STRICT 3x3 GRID & NO PHOTO TITLES */}
            {activeTab.startsWith('category-') && (
              <div>
                {(() => {
                  const catId = activeTab.replace('category-', '');
                  const catMeta = portfolioData.categories.find(c => c.id === catId) || portfolioData.categories[0];
                  const catItems = portfolioData.items.filter(i => i.category === catId);

                  return (
                    <div>
                      <section style={{ position: 'relative', height: '300px', display: 'flex', alignItems: 'flex-end', padding: '3rem 1.5rem', overflow: 'hidden' }}>
                        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${catMeta.bannerImage})`, backgroundSize: 'cover', backgroundPosition: 'center center', filter: 'brightness(0.45)' }} />
                        <div style={{ position: 'relative', zIndex: 2, maxWidth: '1320px', width: '100%', margin: '0 auto' }}>
                          <button onClick={() => setActiveTab('portfolio')} style={{ color: 'var(--text-muted)', fontSize: '0.85rem', fontWeight: 600, marginBottom: '1rem', background: 'rgba(255,255,255,0.05)', padding: '0.4rem 0.9rem', borderRadius: 'var(--radius-full)', border: '1px solid var(--border-light)' }}>
                            ← {t.gallery.backToHub}
                          </button>
                          <h1 style={{ fontSize: 'clamp(2rem, 4vw, 3.2rem)', textTransform: 'uppercase' }}>
                            {lang === 'pt' ? catMeta.titlePt : catMeta.titleEn}
                          </h1>
                        </div>
                      </section>

                      <section style={{ maxWidth: '1320px', margin: '0 auto', padding: '2rem 1.5rem 4rem 1.5rem' }}>
                        {catId === 'motorsport' ? (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '3.5rem' }}>
                            {(catMeta.disciplines || [
                              { id: 'circuit', titleEn: 'Circuit', titlePt: 'Velocidade' },
                              { id: 'rally', titleEn: 'Rally', titlePt: 'Rali' },
                              { id: 'rallycross', titleEn: 'Rallycross', titlePt: 'Rallycross' },
                              { id: 'karting', titleEn: 'Karting', titlePt: 'Karting' },
                              { id: 'hillclimb', titleEn: 'Hillclimb', titlePt: 'Rampa' }
                            ]).map(disc => {
                              const discTitle = lang === 'pt' ? disc.titlePt : disc.titleEn;
                              const discItems = catItems.filter(i => i.subCategory === disc.id);
                              if (discItems.length === 0) return null;
                              return (
                                <div key={disc.id}>
                                  <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem', paddingBottom: '0.75rem', borderBottom: '1px solid var(--border-light)' }}>
                                    <h2 style={{ fontSize: '1.8rem', textTransform: 'uppercase', color: '#FFFFFF', letterSpacing: '0.04em' }}>{discTitle}</h2>
                                    <span style={{ background: 'rgba(0, 102, 255, 0.15)', color: 'var(--accent-blue)', padding: '0.2rem 0.7rem', borderRadius: 'var(--radius-full)', fontSize: '0.8rem', fontWeight: 800 }}>
                                      {discItems.length} {t.hub.photosCount}
                                    </span>
                                  </div>
                                  <div className="gallery-grid-3x3">
                                    {discItems.map(item => (
                                      <div key={item.id} onClick={() => openPhotoLightbox(item, discItems)} className="gallery-item">
                                        <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
                                          <img src={item.image} alt="Photo" />
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        ) : (
                          <div className="gallery-grid-3x3">
                            {catItems.map(item => (
                              <div key={item.id} onClick={() => openPhotoLightbox(item, catItems)} className="gallery-item">
                                <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
                                  <img src={item.image} alt="Photo" />
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </section>

                      {/* OTHER GALLERIES LINKS */}
                      <section style={{ maxWidth: '1320px', margin: '0 auto', padding: '3rem 1.5rem 6rem 1.5rem', borderTop: '1px solid var(--border-light)' }}>
                        <h3 style={{ fontSize: '1.3rem', textTransform: 'uppercase', marginBottom: '1.75rem', color: '#FFFFFF', letterSpacing: '0.04em' }}>
                          {lang === 'pt' ? 'Explorar Outras Galerias' : 'Explore Other Galleries'}
                        </h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1.25rem' }}>
                          {portfolioData.categories.filter(c => c.id !== catId).map(otherCat => {
                            const otherTitle = lang === 'pt' ? otherCat.titlePt : otherCat.titleEn;
                            return (
                              <div key={otherCat.id} onClick={() => { setActiveTab(`category-${otherCat.id}`); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="glass-card" style={{ position: 'relative', height: '130px', borderRadius: 'var(--radius-md)', overflow: 'hidden', cursor: 'pointer', display: 'flex', alignItems: 'flex-end', padding: '1.25rem' }}>
                                <img src={otherCat.bannerImage} alt={otherTitle} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center center', filter: 'brightness(0.55)', transition: 'transform 0.4s ease' }} />
                                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, rgba(8, 10, 16, 0.95) 0%, transparent 100%)' }} />
                                <div style={{ position: 'relative', zIndex: 2, display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%' }}>
                                  <span style={{ fontWeight: 800, fontSize: '0.95rem', color: '#FFFFFF', textTransform: 'uppercase' }}>{otherTitle}</span>
                                  <span style={{ color: 'var(--accent-blue)', fontWeight: 800 }}>→</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </section>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ABOUT PAGE */}
            {activeTab === 'about' && (
              <div style={{ padding: '7rem 1.5rem 5rem 1.5rem', maxWidth: '1320px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '4rem' }}>
                  <h1 style={{ fontSize: 'clamp(2.2rem, 4vw, 3.5rem)', textTransform: 'uppercase', marginBottom: '1rem' }}>{t.about.title}</h1>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '3.5rem', alignItems: 'center', marginBottom: '5rem' }}>
                  <div className="glass-card" style={{ padding: '1rem' }}>
                    <img src="/assets/photographer_portrait.jpg" style={{ width: '100%', borderRadius: 'var(--radius-sm)', display: 'block', objectFit: 'cover' }} alt="Fabmaru Photo Photographer" />
                  </div>
                  <div>
                    <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', lineHeight: 1.7, marginBottom: '1.25rem' }}>{t.about.bioP1}</p>
                    <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', lineHeight: 1.7, marginBottom: '1.25rem' }}>{t.about.bioP2}</p>
                    <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', lineHeight: 1.7, marginBottom: '1.25rem' }}>{t.about.bioP3}</p>
                    <p style={{ color: 'var(--text-muted)', fontSize: '1.05rem', lineHeight: 1.7 }}>{t.about.bioP4}</p>
                  </div>
                </div>
              </div>
            )}

            {/* CONTACT PAGE */}
            {activeTab === 'contact' && (
              <div style={{ padding: '7rem 1.5rem 5rem 1.5rem', maxWidth: '1320px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '4rem' }}>
                  <h1 style={{ fontSize: 'clamp(2.2rem, 4vw, 3.5rem)', textTransform: 'uppercase', marginBottom: '1rem' }}>{t.contact.title}</h1>
                  <p style={{ color: 'var(--text-muted)', fontSize: '1.1rem' }}>{t.contact.subtitle}</p>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '3rem' }}>
                  <div className="glass-card" style={{ padding: '2.5rem' }}>
                    {formSubmitted ? (
                      <div style={{ textAlign: 'center', padding: '2rem' }}>
                        <h3 style={{ fontSize: '1.6rem', color: '#FFFFFF', marginBottom: '1rem' }}>Success!</h3>
                        <p style={{ color: 'var(--text-muted)' }}>{t.contact.form.success}</p>
                      </div>
                    ) : (
                      <form onSubmit={(e) => { e.preventDefault(); setFormSubmitted(true); }} style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                        <div>
                          <label style={{ display: 'block', color: 'var(--text-main)', fontSize: '0.85rem', marginBottom: '0.5rem' }}>{t.contact.form.name} *</label>
                          <input type="text" required placeholder="Alex Silva" style={{ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid var(--border-light)', padding: '0.85rem', color: '#FFF', borderRadius: '4px', outline: 'none' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', color: 'var(--text-main)', fontSize: '0.85rem', marginBottom: '0.5rem' }}>{t.contact.form.email} *</label>
                          <input type="email" required placeholder="alex@raceteam.com" style={{ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid var(--border-light)', padding: '0.85rem', color: '#FFF', borderRadius: '4px', outline: 'none' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', color: 'var(--text-main)', fontSize: '0.85rem', marginBottom: '0.5rem' }}>{t.contact.form.message} *</label>
                          <textarea rows="4" required placeholder="Details..." style={{ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid var(--border-light)', padding: '0.85rem', color: '#FFF', borderRadius: '4px', outline: 'none' }} />
                        </div>
                        <button type="submit" className="btn-primary" style={{ width: '100%' }}>{t.contact.form.send}</button>
                      </form>
                    )}
                  </div>

                  <div className="glass-card" style={{ padding: '2rem' }}>
                    <h3 style={{ fontSize: '1.25rem', marginBottom: '1.5rem', color: '#FFFFFF' }}>DIRECT CONTACT</h3>
                    <p style={{ color: 'var(--text-muted)', marginBottom: '0.5rem' }}>Location: {t.contact.details.location}</p>
                    <p style={{ color: 'var(--accent-blue)', fontWeight: 600, marginBottom: '0.5rem' }}>Email: fabio@fabmaruphoto.com</p>
                    <p style={{ color: '#FFFFFF', fontWeight: 600, marginBottom: '0.5rem' }}>Instagram: @fabmaruphoto</p>
                    <p style={{ color: '#FFFFFF', fontWeight: 600 }}>Facebook: @fabmaruphoto</p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* LIGHTBOX MODAL WITH SMOOTH NEXT/PREV NAVIGATION AND NO PHOTO TITLES */}
          {lightboxIndex !== null && currentGalleryList.length > 0 && (
            <div className="lightbox-backdrop">
              <div style={{ position: 'absolute', top: '1.5rem', right: '2rem', zIndex: 20 }}>
                <button onClick={() => setLightboxIndex(null)} style={{ background: 'var(--accent-blue)', color: '#FFF', border: 'none', padding: '0.5rem 1rem', borderRadius: '4px', cursor: 'pointer', fontWeight: 700 }}>
                  ✕ Close
                </button>
              </div>

              {/* Prev Button */}
              <button onClick={() => handleNavigateLightbox(-1)} style={{ position: 'absolute', left: '2rem', top: '50%', transform: 'translateY(-50%)', zIndex: 20, background: 'rgba(8,10,16,0.85)', border: '1px solid var(--border-light)', color: 'var(--accent-blue)', padding: '0.8rem 1.2rem', borderRadius: '50%', cursor: 'pointer', fontSize: '1.5rem', fontWeight: 900 }}>
                ‹
              </button>

              {/* Next Button */}
              <button onClick={() => handleNavigateLightbox(1)} style={{ position: 'absolute', right: '2rem', top: '50%', transform: 'translateY(-50%)', zIndex: 20, background: 'rgba(8,10,16,0.85)', border: '1px solid var(--border-light)', color: 'var(--accent-blue)', padding: '0.8rem 1.2rem', borderRadius: '50%', cursor: 'pointer', fontSize: '1.5rem', fontWeight: 900 }}>
                ›
              </button>

              <div style={{ textAlign: 'center', maxWidth: '85vw' }}>
                <img src={currentGalleryList[lightboxIndex]?.image} style={{ maxHeight: '82vh', borderRadius: '8px', boxShadow: '0 20px 50px rgba(0,0,0,0.9)' }} />
              </div>
            </div>
          )}

          {/* FOOTER (ALL IMAGES AND CONTENT © FÁBIO MARTINS. ALL RIGHTS RESERVED. & SOCIAL SVG LOGOS) */}
          <footer style={{ background: 'var(--bg-surface)', borderTop: '1px solid var(--border-light)', padding: '3rem 1.5rem 2rem 1.5rem' }}>
            <div style={{ maxWidth: '1320px', margin: '0 auto', display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '1.5rem' }}>
              <div>
                <img src="/assets/logo_main.png" style={{ height: '48px', marginBottom: '0.75rem' }} />
                <p style={{ color: 'var(--text-dim)', fontSize: '0.85rem' }}>{t.footer.rights}</p>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                <span style={{ color: '#FFF', fontWeight: 700, fontSize: '0.9rem', textTransform: 'uppercase' }}>{t.footer.followMe}:</span>
                <a href="https://instagram.com/fabmaruphoto" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram @fabmaruphoto" style={{ width: '42px', height: '42px', borderRadius: '6px', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-light)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent-blue)' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                  </svg>
                </a>
                <a href="https://facebook.com/fabmaruphoto" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook @fabmaruphoto" style={{ width: '42px', height: '42px', borderRadius: '6px', background: 'rgba(255,255,255,0.05)', border: '1px solid var(--border-light)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent-blue)' }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                  </svg>
                </a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
